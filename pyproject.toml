[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mutflow-ddg"
version = "0.1.0"
description = "Paired-state multimodal latent flow for protein stability prediction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "biopython>=1.80",
  "numpy>=1.24",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "torch>=2.1",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
esm = ["transformers>=4.38", "fair-esm>=2.0"]
analysis = ["matplotlib>=3.7", "pandas>=2.0"]

[tool.setuptools.packages.find]
include = ["mutflow_ddg*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
